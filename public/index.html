<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de salas</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">    <style type="text/tailwindcss">
  @theme {
    /* Paleta de colores */ 
    --color-verdeApex: #CCFF00;
    --color-negroBoton: #18181C;
    --color-border-header: #1E1E24;
    --color-grayApex: #8E8E93;
    --color-negroIcon: #121215;
    --color-azulUnab: #263762;
    --color-azulClaroUnab: #3B5597;
    --color-rojoUnab: #d03437;
    --font-Poppins: "Poppins", sans-serif;
  } 
  </style>
</head>
<body>
    <header class="text-gray-600 font-Poppins">
  <div class="container mx-auto flex flex-col md:flex-row items-center justify-between p-5">
    
    <a href="/" class="flex items-center  text-gray-900 mb-4 md:mb-0">
      <img src="assets/logo-unab.png" alt="Logo UNAB" class="w-35 h-15 p-2 ">
      <span class="ml-3 text-xl text-azulUnab font-semibold md:border-l md:border-gray-400 md:pl-4">ReservaUNAB</span>
    </a>

    <nav class="flex items-center text-base md:pl-5 md:ml-5">
      <a href="/" class="mr-5  hover:font-bold hover:underline hover:text-azulUnab">Espacios</a>
      <a href="/reservas" class="mr-5  hover:font-bold hover:underline  hover:text-azulUnab">Mis reservas</a>
    </nav>

<a href="https://portal2.unab.cl/ingresar-al-portal" class="px-4 py-2 bg-azulUnab text-white rounded-full  transition-colors md:ml-auto font-light hover:bg-azulClaroUnab  hover:underline hover:text-white ">
  <img src="assets/icono-login.png" alt="Login" class="inline-block w-6 h-6 ml-0 mr-1">
  ACCESO INTRANET
</a>
  </div>
</header>
<main class="container mx-auto px-5 py-8">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-black">Espacios Disponibles</h1>
        <p class="text-black mt-1">Consulta y reserva salas, laboratorios y espacios universitarios.</p>
    </div>



    <div class="bg-white border border-gray-200 rounded-xl p-5 mb-6">
        <label class="relative block mb-4">
            <img src="assets/lupa.png" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-4">
            <input 
                id="input-buscar"
                type="text" 
                placeholder="Buscar por nombre, edificio o características..."
                class="w-full pl-11 pr-4 py-3 rounded-lg border border-gray-200 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </label>


        <div class="flex flex-wrap gap-3">
        <!--Filtro Edificio -->
            <select id="select-edificio" class="px-7 py-2 rounded-lg border border-gray-200 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Todos los edificios</option>
                <option value="Edificio A">Edificio A</option>
                <option value="Edificio B">Edificio B</option>
                <option value="Edificio C">Edificio C</option>
                <option value="Edificio D">Edificio D</option>
                <option value="Edificio E">Edificio E</option>
                <option value="Biblioteca">Biblioteca</option>
            </select>
            
            <!-- Filtro Tipo-->
            <select id="select-tipo" class="px-7 py-2 rounded-lg border border-gray-200 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Tipo de sala: Todas</option>
                <option value="Sala de clases">Sala de clases</option>
                <option value="Laboratorio">Laboratorio</option>
                <option value="Sala de estudio">Sala de estudio</option>
                <option value="Sala de reunion">Sala de reunion</option>
            </select>
            
            <!--Filtro Capacidad-->
            <select id="select-capacidad" class="px-7 py-2 rounded-lg border border-gray-200 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Capacidad: Todas</option>
		            <option value="Pequeña">Pequeña</option>
		            <option value="Mediana">Mediana</option>
		            <option value="Grande">Grande</option>
		        </select>
        </div>
        
		        <!--Contador-->
            <p id="contador-espacios" class="text-sm text-black mb-4 mt-4">X de Y espacios disponibles</p>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="espacios-grid"></div>
            <template id="tarjeta">
              <article class="bg-white border border-gray rounded-xl overflow-hidden flex flex-col hover:shadow-xl/40 shadow-azulUnab hover:-translate-y-1 transition-all duration-300">
                <div  class="tarjeta-espacio relative h-40 flex items-center justify-center" data-slot="cover">
                  <span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-white/25 backdrop-blur text-white text-xs font-medium" data-slot="nombre"></span>
                  <span class="text-5xl" data-slot="icon"></span>
                </div>
                <div class="p-5 flex flex-col flex-1">
                  <h3 class="text-lg font-semibold text-gray" data-slot="titulo"></h3>
                  <p class="text-sm text-blue mb-2" data-slot="lugar"></p>
                  <p class="text-sm text-gray mb-2" data-slot="descripcion"></p>
                  <p class="text-sm text-gray mb-2" data-slot="aforo"></p>
                  <div class="flex flex-wrap gap-2 mb-4" data-slot="tags"></div>
                  <button type="button" class="btn-solicitar-reserva mt-auto w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium">
                    Solicitar reserva
                  </button>
                </div>
              </article>
            </template>
            </div>
    <div id="modal-reserva" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
      <div id="modal-overlay" class="absolut inset-0 bg-black/50"></div>

      <div class="relative bg-white rounded-xl shadow-xl/40 border border-gray-600 w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between p-5 border-b border-gray-200">
          <h2 id="modal-titulo-espacio" class="text-lg font-semibold text-gray-900">
            Reservar sala
          </h2>
          <button type="button" id="modal-cerrar" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <form id="form-reserva" class="p-5 space-y-4">
          <div>
            <label for="reserva-fecha" class="block text-sm font-medium text-gray-700 mb-1">
              Selecciona la fecha
              <span class="text-red-500">*</span>
            </label>
            <input type="date" id="reserva-fecha" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"> 
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Selecciona un horario disponible
              <span class="text-red-500">*</span>
            </label>
            <p id="mensaje-horarios" class="text-sm text-gray-500 italic">
              Por favor, selecciona una fecha para ver los horarios disponibles.
            </p>
            <div id="contenedor-horas" class="hidden grid grid-cols-3 gap-2">

            </div>
            <input type="hidden" id="reserva-hora-seleccionada" name="hora" required>
          </div>
          
        </form>
      </div>
    </div>
    
    
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
